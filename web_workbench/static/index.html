<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工程经营 · 本机工作台</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/shell.css"><script src="/motion.js" defer></script><script src="/labels.js" defer></script><script src="/navigation.js" defer></script><script src="/table-scrollbar.js" defer></script><script src="/app.js" defer></script><script src="/operations.js" defer></script><script src="/extensions.js" defer></script><script src="/forms.js" defer></script><script src="/labor.js" defer></script><script src="/assistant.js" defer></script><script src="/backup.js" defer></script></head>
<body><aside id="sidebar"><div class="brand"><span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V8l8-4 8 4v12M8 20V10m8 10V10M3 20h18M8 13h8M8 17h8"/></svg></span><div><strong>工程经营</strong><small>项目 · 履约 · 资金</small></div></div><nav id="navigation" aria-label="工作台导航"></nav><div class="sidebar-foot"><span id="mode">正在连接本机数据</span><label><input id="reduced-motion" type="checkbox">减少动态效果</label><small id="motion-note" hidden>跟随系统的减少动态效果设置</small><label><input id="solid-glass" type="checkbox">简洁实色界面</label></div></aside>
<div class="workspace"><header class="topbar"><button id="menu-toggle" class="icon-button" aria-label="显示导航">☰</button><div class="topbar-context"><button id="navigation-back" class="navigation-back" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span>返回上一级</span></button><div class="local-context"><span class="eyebrow">本机经营工作台</span><span class="local-status"><i></i>数据保存在本机</span></div></div><label class="project-filter">项目范围<select id="project-scope" data-search><option value="">全部项目</option></select></label></header>
<main id="main" tabindex="-1"><div class="loading">正在读取工作台…</div></main></div><div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="editor"><form id="editor-form"><header class="dialog-head"><div><span class="eyebrow">核对后保存 · 沿用现有业务规则</span><h2 id="dialog-title"></h2></div><button type="button" id="editor-close" class="icon-button" aria-label="关闭">×</button></header><div id="editor-body" class="dialog-body"></div><div id="form-error" class="inline-error" role="alert" hidden></div><footer class="dialog-foot"><button type="button" id="editor-cancel">取消</button><button type="submit" class="primary" id="editor-save">确认保存</button></footer></form></dialog>
<dialog id="attachment-preview" aria-labelledby="attachment-preview-title"><header class="dialog-head"><div><span class="eyebrow">附件预览 · 仅在本机读取</span><h2 id="attachment-preview-title"></h2></div><button type="button" id="attachment-preview-close" class="icon-button" aria-label="关闭附件预览">×</button></header><div class="attachment-preview-toolbar"><div id="attachment-page-tools" hidden><output id="attachment-page-label"></output></div><div id="attachment-image-tools" hidden><button id="attachment-zoom-out" type="button" aria-label="缩小附件">－</button><output id="attachment-zoom-label">适应窗口</output><button id="attachment-zoom-in" type="button" aria-label="放大附件">＋</button><button id="attachment-fit" type="button">适应窗口</button></div><div class="attachment-actions"><a id="attachment-preview-open" target="_blank" rel="noopener">独立打开</a><a id="attachment-preview-download" target="_blank" rel="noopener">下载原附件</a></div></div><div id="attachment-preview-body" tabindex="0" aria-label="附件内容，可上下滚动阅读"></div><footer class="dialog-foot"><p id="attachment-preview-status" role="status"></p><button id="attachment-preview-done" type="button">返回附件列表</button></footer></dialog>
<link rel="stylesheet" href="/attachment-preview.css"><script src="/attachment-preview.js" defer></script>
<script src="/cost-ledger.js" defer></script>
<link rel="stylesheet" href="/project-ledger.css"><script src="/project-ledger.js" defer></script>
<link rel="stylesheet" href="/cockpit.css"><script src="/cockpit.js" defer></script>
</body></html>
