name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check release privacy
        run: python scripts/check_release_privacy.py
      - name: Run tests
        run: python -m pytest -o addopts= -q --tb=short -p no:cacheprovider
      - name: Check frontend syntax
        shell: pwsh
        run: |
          Get-ChildItem web_workbench/static -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed" }
          }
      - name: Run deterministic frontend tests
        shell: pwsh
        run: |
          $tests = @('test_attachment_continuous', 'test_cockpit_detail', 'test_editor_lifecycle', 'test_governance_sources', 'test_operating_entities', 'test_project_ledger_header', 'test_project_purchase_details', 'test_receipt_income', 'test_search_choice', 'test_workbench_navigation', 'test_entity_record_options', 'test_entry_options', 'test_offer_supplier_tax')
          foreach ($test in $tests) {
            node "scripts/$test.mjs"
            if ($LASTEXITCODE -ne 0) { throw "Frontend test failed: $test" }
          }
