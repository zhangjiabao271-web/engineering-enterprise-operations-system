name: 缺陷报告
description: 报告可以稳定复现的功能问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿上传真实数据库、附件、合同、财务数据、个人信息或 API Key。安全问题请使用 Security 页面的私密漏洞报告。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 例如 1.0.0 或提交 SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明实际结果与预期结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 11 / Python 3.12
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容中不含真实业务数据、个人信息或密钥。
          required: true
